name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opensolve_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/opensolve_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-do-not-use-in-prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        working-directory: packages/shared
        run: npm run build

      - name: Type-check API
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

      - name: Lint web
        working-directory: apps/web
        run: npx next lint --no-install || echo "Web lint skipped (eslint-config-next not configured)"

      - name: Run tests
        working-directory: apps/api
        run: npx vitest run

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build web
        working-directory: apps/web
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t opensolve-api .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t opensolve-web .
