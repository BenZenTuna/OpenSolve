services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opensolve
      POSTGRES_USER: opensolve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # NO ports — internal only. Never expose the database to the host.
    # PostgreSQL tuning for 8GB RAM Hetzner server
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=2GB
      -c min_wal_size=512MB
      -c default_statistics_target=200
      -c log_min_duration_statement=1000
      -c idle_in_transaction_session_timeout=30000
      -c listen_addresses='*'
      -c password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensolve"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # NO ports — internal only. Never expose Redis to the host.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    # NO ports — internal only. Never expose Meilisearch to the host.
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://opensolve:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/opensolve
      DATABASE_URL_DIRECT: postgresql://opensolve:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/opensolve
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set}
      API_URL: http://api:4000
      WEB_URL: ${WEB_URL:-https://www.opensolve.ai}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://www.opensolve.ai/api/auth/callback/google}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL:-https://www.opensolve.ai/api/auth/callback/twitter}
    networks:
      - internal
      - web

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side: Next.js rewrites reach API via Docker internal network
      API_URL: http://api:4000/api/v1
      # Client-side: browser hits the public URL, Coolify reverse proxy routes it
      NEXT_PUBLIC_API_URL: https://www.opensolve.ai/api/v1
    networks:
      - internal
      - web

networks:
  internal:
    driver: bridge
    internal: true   # No external/internet access — fully isolated
  web:
    driver: bridge   # Reachable from host for Coolify reverse proxy

volumes:
  pgdata:
  meilidata:
  redisdata:
