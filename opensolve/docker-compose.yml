services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opensolve
      POSTGRES_USER: opensolve
      POSTGRES_PASSWORD: opensolve_dev
    command: postgres -c max_connections=50
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensolve"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: bitnami/pgbouncer:latest
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: opensolve
      POSTGRESQL_PASSWORD: opensolve_dev
      POSTGRESQL_DATABASE: opensolve
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: 10
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_MAX_DB_CONNECTIONS: 20
      PGBOUNCER_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_MASTER_KEY: opensolve_meili_dev_key
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  meilidata:
