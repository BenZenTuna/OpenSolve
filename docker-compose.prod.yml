services:
  postgres:
    image: postgres:16-alpine
    hostname: os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opensolve
      POSTGRES_USER: opensolve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # NO ports — internal only. Never expose the database to the host.
    # PostgreSQL tuning for 8GB RAM Hetzner server
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c max_wal_size=2GB
      -c min_wal_size=512MB
      -c default_statistics_target=200
      -c log_min_duration_statement=1000
      -c idle_in_transaction_session_timeout=30000
      -c listen_addresses='*'
      -c password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensolve"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    hostname: os-redis
    restart: unless-stopped
    # NO ports — internal only. Never expose Redis to the host.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # IMPORTANT: Use os-postgres and os-redis hostnames to avoid DNS collision
      # with Coolify's own postgres/redis on the shared coolify network
      DATABASE_URL: postgresql://opensolve:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@os-postgres:5432/opensolve
      DATABASE_URL_DIRECT: postgresql://opensolve:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@os-postgres:5432/opensolve
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@os-redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-}
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-}
      API_URL: http://api:4000
      WEB_URL: ${WEB_URL:-https://www.opensolve.ai}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://api.opensolve.ai/api/v1/auth/google/callback}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL:-https://api.opensolve.ai/api/v1/auth/twitter/callback}
      DEBUG_ACCESS_KEY: ${DEBUG_ACCESS_KEY:-}
    labels:
      # === TRAEFIK CONFIGURATION ===
      # Coolify generates its own router labels but does NOT create service port labels
      # or router-to-service bindings. We define our own complete set here.
      # Both Coolify's and our labels coexist on the container — Traefik uses ours
      # because they have explicit .service= bindings.
      - "traefik.enable=true"
      # Service: tells Traefik the container listens on port 4000
      - "traefik.http.services.api-opensolve.loadbalancer.server.port=4000"
      # HTTP router: redirect to HTTPS
      - "traefik.http.routers.api-opensolve-http.rule=Host(`api.opensolve.ai`)"
      - "traefik.http.routers.api-opensolve-http.entrypoints=http"
      - "traefik.http.routers.api-opensolve-http.service=api-opensolve"
      - "traefik.http.routers.api-opensolve-http.middlewares=redirect-to-https"
      # HTTPS router: main traffic
      - "traefik.http.routers.api-opensolve-https.rule=Host(`api.opensolve.ai`)"
      - "traefik.http.routers.api-opensolve-https.entrypoints=https"
      - "traefik.http.routers.api-opensolve-https.tls=true"
      - "traefik.http.routers.api-opensolve-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-opensolve-https.service=api-opensolve"
      - "traefik.http.routers.api-opensolve-https.middlewares=gzip"
      # Shared middlewares
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.gzip.compress=true"
    networks:
      - internal
      - web

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side: Next.js rewrites reach API via Docker internal network
      API_URL: http://api:4000/api/v1
      # Client-side: browser hits the public URL, Coolify reverse proxy routes it
      NEXT_PUBLIC_API_URL: https://www.opensolve.ai/api/v1
    labels:
      # === TRAEFIK CONFIGURATION ===
      - "traefik.enable=true"
      # Service: tells Traefik the container listens on port 3000
      - "traefik.http.services.web-opensolve.loadbalancer.server.port=3000"
      # HTTP routers: redirect to HTTPS (both naked and www domains)
      - "traefik.http.routers.web-opensolve-http.rule=Host(`opensolve.ai`) || Host(`www.opensolve.ai`)"
      - "traefik.http.routers.web-opensolve-http.entrypoints=http"
      - "traefik.http.routers.web-opensolve-http.service=web-opensolve"
      - "traefik.http.routers.web-opensolve-http.middlewares=redirect-to-https"
      # HTTPS routers: main traffic (both naked and www domains)
      - "traefik.http.routers.web-opensolve-https.rule=Host(`opensolve.ai`) || Host(`www.opensolve.ai`)"
      - "traefik.http.routers.web-opensolve-https.entrypoints=https"
      - "traefik.http.routers.web-opensolve-https.tls=true"
      - "traefik.http.routers.web-opensolve-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-opensolve-https.service=web-opensolve"
      - "traefik.http.routers.web-opensolve-https.middlewares=gzip"
    networks:
      - internal
      - web

networks:
  internal:
    driver: bridge
    internal: true
  web:
    driver: bridge

volumes:
  pgdata: {}
  redisdata: {}
